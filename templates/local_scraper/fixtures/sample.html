<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Example Mountain snow report</title></head>
  <body>
    <main class="snow-report">
      <h1>Example Mountain</h1>
      <p data-snow="new">5 cm since the latest report</p>
      <p data-snow="day">8 cm in the last 24 hours</p>
      <p data-snow="week">31 cm in the last seven days</p>
      <p data-snow="base">142 cm base</p>
    </main>
  </body>
</html>
